name: Build desktop apps

# Builds installers for Windows, macOS and Linux. Runs whenever code changes on main
# (not for README-only changes), from Actions → Build desktop apps → Run workflow, or on a
# version tag such as v1.0.0.
#
# Windows code signing (Azure Artifact Signing) switches on by itself once these are set in
# Settings → Secrets and variables → Actions:
#   Secrets:    AZURE_TENANT_ID, AZURE_CLIENT_ID, AZURE_CLIENT_SECRET
#   Variables:  AZURE_SIGNING_ACCOUNT, AZURE_CERT_PROFILE, AZURE_SIGNING_ENDPOINT, AZURE_PUBLISHER_NAME
# Until then the Windows installer is built unsigned, with a warning saying which value is missing.

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['**.md', 'docs/**']

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Tally-Books-Windows
          - os: macos-latest
            name: Tally-Books-Mac
          - os: ubuntu-latest
            name: Tally-Books-Linux
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test

      - name: Build installer
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          SIGN_ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          SIGN_PROFILE: ${{ vars.AZURE_CERT_PROFILE }}
          SIGN_ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          SIGN_PUBLISHER: ${{ vars.AZURE_PUBLISHER_NAME }}
        run: |
          missing=""
          if [ "$RUNNER_OS" = "Windows" ] && [ -n "$AZURE_CLIENT_SECRET" ]; then
            for v in AZURE_TENANT_ID AZURE_CLIENT_ID SIGN_ACCOUNT SIGN_PROFILE SIGN_ENDPOINT SIGN_PUBLISHER; do
              [ -z "${!v}" ] && missing="$missing $v"
            done
          fi
          if [ "$RUNNER_OS" = "Windows" ] && [ -n "$AZURE_CLIENT_SECRET" ] && [ -n "$missing" ]; then
            # Typically while Microsoft is still checking the identity: build unsigned until the profile exists.
            echo "::warning::Signing isn't finished: still missing$missing. Building the Windows installer unsigned for now."
            npx electron-builder --publish never
          elif [ "$RUNNER_OS" = "Windows" ] && [ -n "$AZURE_CLIENT_SECRET" ]; then
            echo "Signing the Windows installer as \"$SIGN_PUBLISHER\" with Azure Artifact Signing"
            echo "SIGNED=1" >> "$GITHUB_ENV"
            # Keep the output so a signing problem shows up in the run's summary (secrets are masked by GitHub).
            set -o pipefail
            if ! npx electron-builder --publish never \
              "-c.win.azureSignOptions.publisherName=$SIGN_PUBLISHER" \
              "-c.win.azureSignOptions.endpoint=$SIGN_ENDPOINT" \
              "-c.win.azureSignOptions.certificateProfileName=$SIGN_PROFILE" \
              "-c.win.azureSignOptions.codeSigningAccountName=$SIGN_ACCOUNT" 2>&1 | tee build.log; then
              grep -iE "error|fail|denied|forbidden|unauthori|not found|exception|status" build.log | grep -v "^\s*$" | tail -n 25 | while IFS= read -r line; do
                echo "::error title=Signing failed::$(echo "$line" | cut -c1-400)"
              done
              exit 1
            fi
          else
            if [ "$RUNNER_OS" = "Windows" ]; then
              echo "::notice::The Windows installer is not signed yet. Add the Azure secrets and variables to sign it."
            fi
            npx electron-builder --publish never
          fi

      - name: Check the Windows signature
        if: runner.os == 'Windows' && env.SIGNED == '1'
        shell: pwsh
        run: |
          $failed = $false
          foreach ($f in Get-ChildItem dist -Filter *.exe) {
            $sig = Get-AuthenticodeSignature $f.FullName
            Write-Host "$($f.Name): $($sig.Status) - $($sig.SignerCertificate.Subject)"
            Write-Host "::notice title=Windows signature::$($f.Name): $($sig.Status), signed by $($sig.SignerCertificate.Subject)"
            if ($sig.Status -ne 'Valid') { $failed = $true }
          }
          if ($failed) { Write-Error 'The installer is not validly signed.'; exit 1 }

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
          if-no-files-found: error
