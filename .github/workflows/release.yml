name: Build desktop apps

# Builds installers for Windows, macOS and Linux. Runs whenever code changes on main
# (not for README-only changes), from Actions → Build desktop apps → Run workflow, or on a
# version tag such as v1.0.0.
#
# Windows code signing (Azure Artifact Signing) switches on by itself once these are set in
# Settings → Secrets and variables → Actions:
#   Secrets:    AZURE_TENANT_ID, AZURE_CLIENT_ID, AZURE_CLIENT_SECRET
#   Variables:  AZURE_SIGNING_ACCOUNT, AZURE_CERT_PROFILE, AZURE_SIGNING_ENDPOINT, AZURE_PUBLISHER_NAME
# Until then the Windows installer is built unsigned, with a warning saying which value is missing.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**']
  # Publishing a release (GitHub → Releases → Draft a new release, tag like v1.3.0) builds that version and
  # attaches the installers to the release. Installed Windows apps find it there and update themselves.
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Sumlora-Windows
          - os: macos-latest
            name: Sumlora-Mac
          - os: ubuntu-latest
            name: Sumlora-Linux
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install
      - run: npm test

      - name: Version from the release tag
        if: github.event_name == 'release'
        shell: bash
        run: |
          TAG="${{ github.event.release.tag_name }}"
          V="${TAG#v}"
          if ! [[ "$V" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then echo "::error::Name the release tag like v1.3.0 (got $TAG)."; exit 1; fi
          npm version "$V" --no-git-tag-version --allow-same-version

      - name: Build installer
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          SIGN_ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          SIGN_PROFILE: ${{ vars.AZURE_CERT_PROFILE }}
          SIGN_ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          SIGN_PUBLISHER: ${{ vars.AZURE_PUBLISHER_NAME }}
          SUMLORA_LICENCE_KEY: ${{ vars.SUMLORA_LICENCE_KEY || vars.TALLY_LICENCE_KEY }}
          SUMLORA_TRIAL_DAYS: ${{ vars.SUMLORA_TRIAL_DAYS }}
        run: |
          missing=""
          if [ "$RUNNER_OS" = "Windows" ] && [ -n "$AZURE_CLIENT_SECRET" ]; then
            for v in AZURE_TENANT_ID AZURE_CLIENT_ID SIGN_ACCOUNT SIGN_PROFILE SIGN_ENDPOINT SIGN_PUBLISHER; do
              [ -z "${!v}" ] && missing="$missing $v"
            done
          fi
          if [ "$RUNNER_OS" = "Windows" ] && [ "$GITHUB_EVENT_NAME" = "release" ] && { [ -z "$AZURE_CLIENT_SECRET" ] || [ -n "$missing" ]; }; then
            # Installed apps update themselves from releases, so a release must be signed.
            echo "::error::A release needs a signed Windows installer, and signing isn't fully set up (missing:${missing:- the Azure secrets})."
            exit 1
          elif [ "$RUNNER_OS" = "Windows" ] && [ -n "$AZURE_CLIENT_SECRET" ] && [ -n "$missing" ]; then
            # Typically while Microsoft is still checking the identity: build unsigned until the profile exists.
            echo "::warning::Signing isn't finished: still missing$missing. Building the Windows installer unsigned for now."
            npx electron-builder --publish never
          elif [ "$RUNNER_OS" = "Windows" ] && [ -n "$AZURE_CLIENT_SECRET" ]; then
            echo "Signing the Windows installer as \"$SIGN_PUBLISHER\" with Azure Artifact Signing"
            echo "SIGNED=1" >> "$GITHUB_ENV"
            # Tells the app it's a signed build, so it may update itself (electron/updater.js).
            # Licence codes: your public key (from the Licences page in your own Sumlora), in the SUMLORA_LICENCE_KEY variable.
            node -e "const k = String(process.env.SUMLORA_LICENCE_KEY || '').split(/[\s,]+/).filter(x => /^[A-Za-z0-9_-]{43}$/.test(x)); const tv = String(process.env.SUMLORA_TRIAL_DAYS || '').trim(), t = /^[0-9]{1,3}$/.test(tv) ? Math.min(+tv, 365) : 30; require('fs').writeFileSync('electron/build-info.json', JSON.stringify({ signed: true, publisher: process.env.SIGN_PUBLISHER, licenceKeys: k, licenceTrialDays: t })); console.log(k.length ? 'Licence codes are on (' + k.length + ' key), ' + (t === 0 ? 'no free trial: a code is needed from the start.' : t + '-day free trial.') : 'Licence codes are off: no SUMLORA_LICENCE_KEY variable.')"
            # Keep the output so a signing problem shows up in the run's summary (secrets are masked by GitHub).
            set -o pipefail
            # Our own signing script (scripts/azure-sign.js) calls Azure's TrustedSigning module directly:
            # electron-builder's built-in azureSignOptions passes paths with extra quotes, which the module rejects.
            pwsh -NoProfile -NonInteractive -Command "Install-PackageProvider -Name NuGet -MinimumVersion 2.8.5.201 -Force -Scope CurrentUser | Out-Null; Install-Module -Name TrustedSigning -MinimumVersion 0.5.0 -Force -Repository PSGallery -Scope CurrentUser"
            if ! npx electron-builder --publish never \
              "-c.win.signtoolOptions.sign=scripts/azure-sign.js" \
              "-c.win.signtoolOptions.publisherName=$SIGN_PUBLISHER" 2>&1 | tee build.log; then
              grep -iE "error|fail|denied|forbidden|unauthori|not found|exception|status" build.log | grep -v "^\s*$" | tail -n 25 | while IFS= read -r line; do
                echo "::error title=Signing failed::$(echo "$line" | cut -c1-400)"
              done
              exit 1
            fi
          else
            if [ "$RUNNER_OS" = "Windows" ]; then
              echo "::notice::The Windows installer is not signed yet. Add the Azure secrets and variables to sign it."
            fi
            npx electron-builder --publish never
          fi

      - name: Check the Windows signature
        if: runner.os == 'Windows' && env.SIGNED == '1'
        shell: pwsh
        run: |
          $failed = $false
          foreach ($f in Get-ChildItem dist -Filter *.exe) {
            $sig = Get-AuthenticodeSignature $f.FullName
            Write-Host "$($f.Name): $($sig.Status) - $($sig.SignerCertificate.Subject)"
            Write-Host "::notice title=Windows signature::$($f.Name): $($sig.Status), signed by $($sig.SignerCertificate.Subject)"
            if ($sig.Status -ne 'Valid') { $failed = $true }
          }
          if ($failed) { Write-Error 'The installer is not validly signed.'; exit 1 }

      - name: Attach the installers to the release
        if: github.event_name == 'release'
        # Automatic updates need only the Windows files; a Mac or Linux upload problem is reported but doesn't fail the build.
        continue-on-error: ${{ runner.os != 'Windows' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          files=(dist/*.exe dist/*.exe.blockmap dist/latest*.yml dist/*.dmg dist/*.dmg.blockmap dist/*.AppImage)
          [ ${#files[@]} -gt 0 ] || { echo "::error::No installers to attach. dist has: $(ls dist | tr '\n' ' ')"; exit 1; }
          for try in 1 2 3; do
            if out=$(gh release upload "${{ github.event.release.tag_name }}" "${files[@]}" --clobber --repo "$GITHUB_REPOSITORY" 2>&1); then
              echo "::notice title=Release::Attached ${files[*]}"; exit 0
            fi
            echo "Upload try $try failed: $out"
            sleep $((try * 15))
          done
          echo "::error title=Attaching to the release failed::$(echo "$out" | tr '\n' ' ' | cut -c1-500)"
          exit 1

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
          if-no-files-found: error
