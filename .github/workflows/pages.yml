name: Publish online demo

# Builds the browser-only demo (example data, nothing saved) and puts it on the gh-pages branch,
# which GitHub Pages serves at https://shersahray.github.io/tally-books/
# (Settings → Pages → Source: "Deploy from a branch", branch gh-pages, folder / (root)).

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['public/**', 'scripts/**', 'src/**', '.github/workflows/pages.yml']

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build demo page
        run: |
          node scripts/build-demo.js
          mkdir -p site
          {
            echo '<!doctype html><html lang="en"><head><meta charset="utf-8">'
            echo '<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">'
            echo '<link rel="icon" href="icon.svg" type="image/svg+xml"></head><body>'
            cat dist/demo.html
            echo '</body></html>'
          } > site/index.html
          cp public/icon.svg site/icon.svg
          touch site/.nojekyll
      - name: Publish to the gh-pages branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd site
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Online demo from ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
