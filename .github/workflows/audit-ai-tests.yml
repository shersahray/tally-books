name: Audit AI draft tests
on:
  pull_request:
    paths:
      - 'src/server/audit-*.js'
      - 'test/audit-*.test.js'
      - '.github/workflows/audit-ai-tests.yml'
  workflow_dispatch:
jobs:
  audit-ai:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.1'
      - name: Install PDF tools for test environment
        run: sudo apt-get update && sudo apt-get install -y poppler-utils tesseract-ocr tesseract-ocr-eng tesseract-ocr-fra
      - name: Run Audit AI tests
        run: node --test test/audit-evidence.test.js test/audit-intake-access.test.js test/audit-service.test.js test/audit-ledger.test.js test/audit-malware.test.js test/audit-registry.test.js test/audit-multitenant.test.js test/audit-isolated.test.js
