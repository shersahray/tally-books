<!doctype html>
<html lang="en" translate="no">
<head>
<meta charset="utf-8">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sumlora</title>
<meta name="description" content="Double-entry bookkeeping for small businesses.">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-512.png">
<meta name="theme-color" content="#0A7369">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sumlora">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Serif:wght@500;600&display=swap">
<link rel="stylesheet" href="styles.css">
<script src="theme.js"></script>
</head>
<body>
<div class="app">
  <aside class="side">
    <button class="brand" id="coSwitch" type="button" title="Switch company"><b class="logo" data-logo aria-label="Sumlora"></b><span class="co" id="coName" translate="no">Loading…</span><span class="switch">Switch company</span></button>
    <div class="newwrap">
      <button class="btn primary block" id="newBtn" aria-haspopup="true" aria-expanded="false">+ New</button>
      <div class="menu" id="newMenu" hidden>
        <div class="col"><h4>Customers</h4>
          <button data-new="invoice">Invoice</button>
          <button data-new="payment">Receive payment</button>
          <button data-new="deposit">Deposit</button>
          <button data-new="credit">Credit note</button>
        </div>
        <div class="col"><h4>Vendors</h4>
          <button data-new="bill">Bill</button>
          <button data-new="billpayment">Pay bill</button>
          <button data-new="expense">Expense</button>
          <button data-new="vcredit">Vendor credit</button>
        </div>
        <div class="col"><h4>Other</h4>
          <button data-new="transfer">Transfer</button>
          <button data-new="journal">Journal entry</button>
          <button data-new="import">Import bank statement</button>
          <button data-new="payrun">Run payroll</button>
        </div>
        <div class="col"><h4>Lists</h4>
          <button data-new="contact">Customer or vendor</button>
          <button data-new="employee">Employee</button>
          <button data-new="account">Account</button>
        </div>
      </div>
    </div>
    <nav class="nav" id="nav" aria-label="Sections">
      <button data-view="dashboard">Dashboard</button>
      <button data-view="sales">Sales <span class="count" id="odCount" hidden></span></button>
      <button data-view="expenses">Expenses</button>
      <button data-view="receipts">Receipts <span class="count info" id="rcCount" hidden></span></button>
      <button data-view="banking">Banking <span class="count info" id="bankCount" hidden></span></button>
      <button data-view="salestax">Sales tax <span class="count" id="taxCount" hidden></span></button>
      <button data-view="payroll">Payroll <span class="count" id="payCount" hidden></span></button>
      <button data-view="transactions">Transactions</button>
      <button data-view="review">Review <span class="count" id="rvCount" hidden></span></button>
      <button data-view="accounts">Chart of accounts</button>
      <button data-view="reports">Reports</button>
      <button data-view="settings">Settings</button>
    </nav>
    <div class="side-foot" id="userBox"></div>
  </aside>
  <main id="main"><div class="empty"><b>Opening your books…</b>Loading accounts and transactions.</div></main>
</div>
<div id="modalRoot"></div>
<div id="lockRoot"></div>
<div id="confirmRoot"></div>
<div id="toastRoot"></div>
<script src="i18n.js"></script>
<script src="fr.js"></script>
<script src="gifi.js"></script>
<script src="plans.js"></script>
<script src="industries.js"></script>
<script src="logo.js"></script>
<script src="bankparse.js"></script>
<script src="app.js"></script>
<script src="banking.js"></script>
<script src="ai.js"></script>
<script src="receipts.js"></script>
<script src="convert-parse.js"></script>
<script src="convert.js"></script>
<script src="pdf.js"></script>
<script src="docout.js"></script>
<script src="sales-extras.js"></script>
<script src="salestax.js"></script>
<script src="reports.js"></script>
<script src="review.js"></script>
<script src="payroll-calc.js"></script>
<script src="payroll.js"></script>
<script src="payroll-yearend.js"></script>
<script src="payroll-roe.js"></script>
<script src="activity.js"></script>
<script src="backups.js"></script>
<script src="qr.js"></script>
<script src="auth.js"></script>
<script src="companies.js"></script>
<script src="licence.js"></script>
<script src="overview.js"></script>
</body>
</html>
